<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SML Smart Telemetry Routing</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-blue-900 text-white p-4 shadow font-bold tracking-wider">📦 SML GLOBAL SMART LOGISTICS SYSTEM</nav>
    <main class="max-w-6xl mx-auto my-8 p-6 bg-white rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-900">Live Delivery Analytics Terminal</h2>
        <div class="flex gap-2 mb-6">
            <input type="text" id="track-id" placeholder="Provide Unique SML Tracking Reference" class="flex-grow p-3 border rounded focus:ring-2 focus:ring-blue-600 focus:outline-none">
            <button onclick="startTrackingPipeline()" class="bg-blue-900 text-white px-6 py-3 rounded font-bold hover:bg-blue-800">Initiate Tracking Session</button>
            <button onclick="simulateDriverMovement()" class="bg-orange-600 text-white px-4 py-3 rounded font-bold text-xs hover:bg-orange-500">[Simulate Truck Movement]</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded text-center shadow-sm">
                <span class="block text-xs uppercase font-bold text-blue-700 tracking-wide">Distance to Target</span>
                <span id="stat-distance" class="text-3xl font-extrabold text-blue-900">---</span> <span class="text-xs font-bold text-blue-900">miles</span>
            </div>
            <div class="bg-green-50 border border-green-200 p-4 rounded text-center shadow-sm">
                <span class="block text-xs uppercase font-bold text-green-700 tracking-wide">Calculated Transit Window</span>
                <span id="stat-eta" class="text-3xl font-extrabold text-green-900">---</span> <span class="text-xs font-bold text-green-900">hrs left</span>
            </div>
            <div class="bg-purple-50 border border-purple-200 p-4 rounded text-center shadow-sm">
                <span class="block text-xs uppercase font-bold text-purple-700 tracking-wide">Average Vehicle Velocity</span>
                <span id="stat-speed" class="text-3xl font-extrabold text-purple-900">---</span> <span class="text-xs font-bold text-purple-900">MPH</span>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-100 p-4 rounded text-sm h-[400px] overflow-y-auto">
                <h3 class="font-bold text-base mb-3 text-blue-900">Manifest Information</h3>
                <div class="space-y-1 mb-4 text-xs">
                    <p><strong>Sender:</strong> <span id="lbl-sender">---</span></p>
                    <p><strong>Recipient:</strong> <span id="lbl-receiver">---</span></p>
                    <p><strong>Route Hub Path:</strong> <span id="lbl-path">---</span></p>
                </div>
                <hr class="my-3"/>
                <h4 class="font-bold mb-2 text-xs uppercase tracking-wider text-gray-500">Live Milestones</h4>
                <ul id="geo-history-log" class="space-y-2 border-l border-blue-900 pl-3 text-xs"></ul>
            </div>
            <div class="md:col-span-2 relative">
                <div id="live-map" class="w-full h-[400px] bg-gray-200 rounded-lg shadow-inner border"></div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
              </html>
